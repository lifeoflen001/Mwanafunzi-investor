name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, fileinfo, mbstring, intl, bcmath, pdo_mysql, pdo_sqlite, sqlite3, zip
          tools: composer:v2
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Validate Composer manifest
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: |
          npm run build
          test -s public/build/manifest.json

      - name: Prepare test environment
        env:
          APP_ENV: testing
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check PHP formatting
        run: vendor/bin/pint --test app/Http/Middleware/RequestContext.php

      - name: Run application tests
        env:
          APP_ENV: testing
          ADMIN_MFA_REQUIRED: 'false'
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          DB_URL: ""
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
        run: php artisan test

      - name: Audit PHP dependencies
        run: composer audit --no-interaction

      - name: Audit production frontend dependencies
        run: npm audit --omit=dev --audit-level=high
